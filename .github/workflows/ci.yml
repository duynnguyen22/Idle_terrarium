name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - name: Get Playwright version
        id: pw
        run: echo "version=$(pnpm exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}
      - name: Install Playwright Chromium
        run: |
          for i in 1 2 3; do
            pnpm exec playwright install chromium && exit 0
            echo "Browser download failed (attempt $i), retrying..."; sleep 10
          done
          exit 1
      # The runner image already ships Chromium's libraries; this only adds extra fonts.
      # Ubuntu mirrors sometimes fail DNS on hosted runners, so retry and never fail the job here.
      - name: Install Playwright system deps (best effort)
        continue-on-error: true
        run: |
          for i in 1 2 3; do
            pnpm exec playwright install-deps chromium && exit 0
            echo "apt install failed (attempt $i), retrying..."; sleep 15
          done
          exit 1
      - run: pnpm e2e
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore
      - name: Upload e2e screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-screenshot
          path: test-results/studio-journey.png
          if-no-files-found: ignore
